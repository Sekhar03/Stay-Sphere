name: StaySphere CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: staysphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/staysphere_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/staysphere_test?schema=public"

      - name: Run Unit Tests
        run: npm run test
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/staysphere_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/staysphere_test?schema=public"
          JWT_SECRET: "ci_jwt_secret_token_staysphere_32chars"
          RAZORPAY_KEY_SECRET: "ci_mock_secret"
          RAZORPAY_WEBHOOK_SECRET: "ci_webhook_secret"

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/staysphere_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/staysphere_test?schema=public"
          JWT_SECRET: "ci_jwt_secret_token_staysphere_32chars"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
